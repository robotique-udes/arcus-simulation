services:
  arcus:
    privileged: true
    build: .
    container_name: arcus
    volumes:
      - ../sim_ws/src:/sim_ws/src
      - ../../arcus:/sim_ws/src/arcus
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/nsswitch.conf:/etc/nsswitch.conf:ro
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    environment:
      - DISPLAY=${DISPLAY}
      - MPLBACKEND=TkAgg
      - MESA_GL_VERSION_OVERRIDE=3.3
      - MESA_GLSL_VERSION_OVERRIDE=330
      - ROS_DOMAIN_ID=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_LOCALHOST_ONLY=1
      # lo isn't multicast-capable, so Cyclone falls back to unicast discovery with
      # auto participant indices (default max 9 => only 10 ROS processes). Raise it.
      - "CYCLONEDDS_URI=<CycloneDDS><Domain><Discovery><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>100</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>"

    network_mode: host
    stdin_open: true
    tty: true

    working_dir: /sim_ws

  
