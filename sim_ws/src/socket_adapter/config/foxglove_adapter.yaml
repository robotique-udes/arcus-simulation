socket_adapter:
  ros__parameters:
    url: "ws://localhost:8765"
    from_remote:
      - "/master_error_code"
      - "/master_hearbeat"
    to_remote:
      - "/controller/drive:ackermann_msgs/msg/AckermannDriveStamped"
      - "/deadman_active:std_msgs/msg/Bool"
      - "/joy:sensor_msgs/msg/Joy"
    local_prefix: ""